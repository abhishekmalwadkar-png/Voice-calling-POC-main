[agent]
# URL of your local Live Portal /api/ingest endpoint
# If on same local network / VPN, put your local machine's IP (e.g. http://192.168.1.50:8088/api/ingest)
# If using Cloudflare tunnel, put the public https://xxxx.trycloudflare.com/api/ingest URL
portal_url = http://localhost:8088/api/ingest

# Command to execute and monitor
command = start_server.bat

# Batch settings
batch_size = 5
batch_interval_sec = 0.2
